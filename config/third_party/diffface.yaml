name: diffface
function: metric
project_root: ${root_dir}/third_party/DiffFace

origin:
  skip_timesteps: 25
  model: ddpm # ddim or ddpm
  timestep_respacing: 100
  aug_num: 8
  iterations_num: 4
  masking_threshold: 30

dataset:
  metric_dir: data/FFHQ_test
  sample_dir: data/FFHQ_sample
  metric_pairs: 3000
  image_size: 256
  cloak_dir: data/FFHQ_cloak
  cloak_mix: true
  cloak_count: full
  cloak_index: 0
  cloak_min_distance: 1.04
  cloak_distance: 1.31

defense:
  batch_size: 60 # cloak selection
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.10
    G: 0.09
    B: 0.10
    identity: 500
  weight:
    perturb: 30
    identity: 1000000
    cloak: 3000000
    context: 100000
  silent_perturb: false
  only_save_summary: true
  log_interval: 100