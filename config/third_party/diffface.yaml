name: diffface
function: metric

project_root: third_party/DiffFace

origin:
  skip_timesteps: 25
  model: ddpm # ddim or ddpm
  timestep_respacing: 100
  aug_num: 8
  iterations_num: 4
  masking_threshold: 30

dataset:
  resolution: 1024
  metric_dir: data/FFHQ_${third_party.dataset.resolution}
  metric_pairs: 3000
  input_size: 256
  cloak: real
  cloak_dir: "data/FFHQ_cloak/${third_party.dataset.cloak}"
  cloak_mix: true
  cloak_index: 0

defense:
  batch_size: 1 # limited by DiffFace