name: diffface
function: metric

project_root: third_party/DiffFace

origin:
  skip_timesteps: 25
  model: ddpm # ddim or ddpm
  timestep_respacing: 100
  aug_num: 8
  iterations_num: 4
  masking_threshold: 30

dataset:
  resolution: 1024
  metric_dir: data/FFHQ_${third_party.dataset.resolution}
  metric_pairs: 3
  input_size: 256
  cloak: real
  cloak_dir: "data/FFHQ_cloak_${third_party.dataset.resolution}/${third_party.dataset.cloak}"
  cloak_mix: true
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 3 # cloak selection
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.075
    G: 0.03
    B: 0.075
    context: 30
  weight:
    perturb: 1000 # 1000
    identity: 0 # 10000
    context: 10