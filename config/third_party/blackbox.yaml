name: blackbox
function: metric
simswap_dir: ${root_dir}/third_party/SimSwap
hififace_dir: ${root_dir}/third_party/HifiFace
faceshifter_dir: ${root_dir}/third_party/FaceShifter/ModelC
diffface_dir: ${root_dir}/third_party/DiffFace

origin:
  hififace:
    config_path: config/model.yaml
    checkpoint_path: checkpoints/hififace_opensource_299999.ckpt
  faceshifter:
    model_path: face_modules/model_ir_se50.pth
    G_path: saved_models/G_latest.pth
  face_parser_path: ${root_dir}/checkpoints/diffface/FaceParser.pth
  diffface:
    skip_timesteps: 25
    model: ddpm # ddim or ddpm
    timestep_respacing: 100
    aug_num: 8
    iterations_num: 4
    masking_threshold: 30

dataset:
  metric_dir: data/FFHQ_test
  cloak_dir: data/FFHQ_cloak
  metric_pairs: 3000
  image_size: 256
  cloak_mix: true
  cloak_count: full
  cloak_min_distance: 1.04
  cloak_distance: 1.31

defense:
  batch_size: 10
  epochs: 1000
  epsilon: 0.003
  targets: [simswap,faceshifter,hififace,infoswap,e4s,uniface,diffface,diffswap]
  region_weight_outside: 3.0
  region_weight_face: 1.5
  region_weight_feature: 0.9
  dynamic_weight_strength: 1.0
  dynamic_weight_epsilon: 1.0e-6
  dynamic_weight_progress_ema_decay: 0.9
  dynamic_weight_variance_weight: 0.5
  cloak_target_ratio: 0.4
  limit:
    R: 0.085
    G: 0.030
    B: 0.100
    arcface: 0.006
    facenet: 0.006
  weight:
    perturb: 750
    background: 1500
    structure: 1200
    tv: 250
    arcface_push: 16000
    arcface_cloak: 18000
    facenet_push: 16000
    facenet_cloak: 18000
  silent_perturb: false
  only_save_summary: true
  log_interval: 100
