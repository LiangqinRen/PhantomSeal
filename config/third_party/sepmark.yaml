name: sepmark
function: forensics_robustness_metric
project_root: ${root_dir}/third_party/SepMark
simswap_root: ${root_dir}/third_party/SimSwap

origin:
  image_size: 256
  message_length: 128
  message_range: 0.038
  batch_size: 1
  lr: 0.0002
  beta1: 0.5
  attention_encoder: se
  attention_decoder: se
  weight:
    - 1 # encoder
    - 10 # decoder_C
    - 10 # decoder_R
    - 10 # decoder_F
    - 0.1 # discriminator

dataset:
  metric_dir: data/sepmark_test
  use_224: false
  metric_pairs: 3000
  cloak_dir: data/vggface2_cloak
  cloak_mix: true

defense:
  batch_size: 100
  max_wrong_bits: 13
  only_save_summary: true
  model_path: ${root_dir}/checkpoints/sepmark/EC_90.pth

robustness:
  logo_img_path: data/vggface2_samples_224/ccs.png