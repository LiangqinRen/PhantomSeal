name: faceshifter
function: metric

origin:
  model_path: third_party/FaceShifter/ModelC/face_modules/model_ir_se50.pth
  G_path: third_party/FaceShifter/ModelC/saved_models/G_latest.pth

dataset:
  metric_512_dir: data/vggface2_512
  use_224: false
  metric_pairs: 3000
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: 30
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 10
  epochs: 750
  epsilon: 0.1
  limit:
    R: 0.075
    G: 0.03
    B: 0.075
    context: 30
  weight:
    perturb: 7500
    identity: 10000
    context: 0