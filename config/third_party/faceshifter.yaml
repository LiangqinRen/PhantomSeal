name: faceshifter
function: metric
project_root: ${root_dir}/third_party/FaceShifter/ModelC

origin:
  model_path: ${root_dir}/checkpoints/faceshifter/model_ir_se50.pth
  G_path: ${root_dir}/checkpoints/faceshifter/G_latest.pth

dataset:
  metric_512_dir: data/vggface2_512_test
  use_224: false
  metric_pairs: 3000
  swap_batch_size: 30
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: full
  cloak_min_distance: 1.04
  cloak_distance: 1.20

defense:
  batch_size: 60
  epochs: 1000
  epsilon: 0.003
  limit:
    R: 0.075
    G: 0.030
    B: 0.075
    identity: 0.002
  weight:
    perturb: 1000
    identity: 150
    cloak: 50000
  silent_perturb: true
  only_save_summary: true
  log_interval: 100

lowkey:
  batch_size: 60
  epochs: 1000
  epsilon: 0.005
  silent_perturb: true
  log_interval: 100
  weight:
    perturb: 1000
    identity: 2000
