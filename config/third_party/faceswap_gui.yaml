name: faceswap_gui
function: perturb
faceswap_dir: ${root_dir}/third_party/faceswap

dataset:
  input_dir: ${root_dir}/data/faceswap_gui
  output_dir: ${log_dir}/perturbed_aligned
  clean_swap_dir: null
  protected_swap_dir: null
  image_size: 256

defense:
  model_dir: ${root_dir}/checkpoints/faceswap_gui
  config_file: null
  batch_size: 16
  epochs: 1000
  epsilon: 0.005
  log_interval: 100
  limit:
    R: 0.08
    G: 0.04
    B: 0.1
    latent: 75
  weight:
    perturb: 750
    latent: 0.1
