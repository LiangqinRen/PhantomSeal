name: uniface
function: metric
project_root: ${root_dir}/third_party/UniFace

origin:
  checkpoint_path: ${root_dir}/checkpoints/uniface/500000.pt
  size: 256
  latent_channel_size: 512
  latent_spatial_size: 8
  lr_mul: 1
  channel_multiplier: 2
  normalize_mode: LayerNorm
  small_generator: False

dataset:
  metric_512_dir: data/vggface2_512_test
  metric_pairs: 30
  batch_size: 30
  image_size: 256
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: full
  cloak_index: 0
  cloak_min_distance: 1.04
  cloak_distance: 1.20
