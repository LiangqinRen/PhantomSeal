name: simswap
function: metric

dataset:
  sample_dir: data/samples_224
  metric_224_dir: data/vggface2_224
  metric_512_dir: data/vggface2_512
  use_224: true
  metric_pairs: 3000
  cloak: real
  cloak_dir: "data/cloak_224/${third_party.dataset.cloak}"
  cloak_mix: true
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 10
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.075
    G: 0.03
    B: 0.075
    context: 30
  weight:
    perturb: 1000
    identity: 10000
    context: 0.1

robustness:
  ai_beauty: false
  ai_beauty_tool: null
  logo_img_path: data/samples_224/NDSS.jpg