name: simswap
function: metric

dataset:
  sample_dir: data/vggface2_samples_224
  metric_224_dir: data/vggface2_224
  metric_512_dir: data/vggface2_512
  use_224: true
  metric_pairs: 3000
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: 30
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 30
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.075
    G: 0.03
    B: 0.075
    context: 30
  weight:
    perturb: 1000
    identity: 10000
    context: 0.1
  momentum: 0.8
  failure_defense_tracing: false
  silent_perturb: true
  only_save_summary: true


lowkey:
  batch_size: 15
  epochs: 300
  epsilon: 0.005
  weight:
    perturb: 1000
    identity: 10000

robustness:
  ai_beauty: false
  ai_beauty_tool: null
  logo_img_path: data/samples_224/ccs.png

misc:
  dataset: vggface2