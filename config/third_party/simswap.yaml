name: simswap
function: metric
project_root: ${root_dir}/third_party/SimSwap

dataset:
  sample_dir: data/vggface2_samples_224
  metric_224_dir: data/vggface2_224_test
  metric_512_dir: data/vggface2_512_test
  use_224: true
  metric_pairs: 3000
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: full
  cloak_min_distance: 1.04
  cluster_count: 10
  cluster_index: 0
  cloak_index: 0
  cloak_distance: 1.20

defense:
  batch_size: 60
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.075
    G: 0.030
    B: 0.075
    context: 25
    identity: 0.003
  weight:
    perturb: 1000
    identity: 10000
    cloak: 10000
    context: 0.1
  momentum: 0.8
  failure_defense_tracing: false
  silent_perturb: false
  only_save_summary: true
  log_interval: 100


lowkey:
  batch_size: 15
  epochs: 300
  epsilon: 0.005
  weight:
    perturb: 1000
    identity: 10000

robustness:
  ai_beauty: false
  ai_beauty_tool: null # ai_lab_tools or tencent_cloud
  logo_img_path: data/vggface2_samples_224/ccs.png

misc:
  dataset: vggface2