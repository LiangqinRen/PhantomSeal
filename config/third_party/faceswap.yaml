name: faceswap
function: metric

dataset:
  data_dir: data/faceswap

worker:
  batch_size: 128
  epochs: 50000
  log_interval: 100
  pert_prefix: null
  poison_percent: 0
  identity: null

defense:
  model_path: checkpoints/faceswap/faceswap.pth
  batch_size: 128
  epochs: 1000
  epsilon: 0.005
  limit:
    R: 0.08
    G: 0.002
    B: 0.1
    latent: 75
  weight:
    perturb: 750
    latent: 0.1