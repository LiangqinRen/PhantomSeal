name: denoiser
function: train
project_root: ${root_dir}/third_party/SimSwap

origin:
  simswap:
    checkpoints_dir: ${root_dir}/checkpoints/simswap
    arcface_path: ${root_dir}/checkpoints/simswap/arcface_checkpoint.tar
    name: people
    which_epoch: latest
    crop_size: 224

dataset:
  root_dir: ${root_dir}/data/denoiser
  train_dir: ${third_party.dataset.root_dir}/train
  validate_dir: ${third_party.dataset.root_dir}/validate
  test_dir: ${third_party.dataset.root_dir}/test
  image_size: 224
  max_train_images: 250

model:
  base_channels: 16
  depth: 3
  residual: true

defense:
  batch_size: 32
  epochs: 10
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001

internal:
  simswap: true
  interval: 0
  final: true
  batch_size: 128
  max_images: null
  cloak_dir: ${third_party.dataset.validate_dir}/cloak
  target_dir: ${third_party.dataset.validate_dir}/target
  save_images: true
  only_save_summary: true

test:
  checkpoint_path: null
  batch_size: 32
  max_images: null
  cloak_dir: ${third_party.dataset.test_dir}/cloak
  target_dir: ${third_party.dataset.test_dir}/target
  save_images: true
  only_save_summary: true
