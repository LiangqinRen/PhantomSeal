name: hififace
function: metric

origin:
  config_path: config/model.yaml
  checkpoint_path: checkpoints/hififace_opensouce_299999.ckpt

dataset:
  metric_512_dir: data/vggface2_512
  use_224: false
  metric_pairs: 3000
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: 30
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 10
  epochs: 750
  epsilon: 0.003
  limit:
    R: 0.075
    G: 0.025
    B: 0.075
    context_final: 50
    context_3d: 100
  weight:
    perturb: 10000
    identity_3d: 10000
    identity_id: 5000
    context_3d: 0
    context_middle: 0
    context_final: 0