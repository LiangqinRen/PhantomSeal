name: unify
function: metric

origin:
  config_path: config/model.yaml
  checkpoint_path: checkpoints/hififace_opensouce_299999.ckpt
  model_path: third_party/FaceShifter/ModelC/face_modules/model_ir_se50.pth
  G_path: third_party/FaceShifter/ModelC/saved_models/G_latest.pth

dataset:
  metric_224_dir: data/vggface2_224
  metric_512_dir: data/vggface2_512
  use_224: false
  metric_pairs: 3000
  # cloak: real
  # cloak_dir: "data/vggface2_cloak_224/${third_party.dataset.cloak}"
  # cloak_mix: true
  # cloak_index: 0
  # cloak_min_distance: 1.04
  cloak_dir: data/vggface2_cloak
  cloak_mix: true
  cloak_count: 30
  cloak_index: 0
  cloak_min_distance: 1.04

defense:
  batch_size: 5
  epochs: 1000
  epsilon: 0.001
  limit:
    R: 0.075
    G: 0.03
    B: 0.075
  weight:
    perturb: 1000
    simswap: 1500
    hififace_3d: 1000
    hififace_id: 1000
    faceshifter: 2000