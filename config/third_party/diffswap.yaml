name: diffswap
function: swap
project_root: ${root_dir}/third_party/DiffSwap
checkpoint_dir: ${root_dir}/checkpoints/diffswap
checkpoint_path: ${third_party.checkpoint_dir}/diffswap.pth
face_recognition_checkpoint_path: ${third_party.checkpoint_dir}/glint360k_r100.pth
shape_predictor_path: ${third_party.checkpoint_dir}/shape_predictor_68_face_landmarks.dat

origin:
  ddim_steps: 200
  ddim_eta: 0.0
  tgt_scale: 0.01
  quiet_third_party: true
  detector_upsample: 1
  detector_resize_scales: [1.0, 1.25, 1.5, 2.0]
  detection_failure_fallback: target
  runtime_cache_dir: ${root_dir}/.cache/diffswap_runtime

model:
  image_size: 256
  crop_size: 112

dataset:
  metric_dir: data/FFHQ_test
  sample_dir: data/FFHQ_sample
  metric_pairs: 10
  image_size: 256
  batch_size: 10
  cloak_dir: data/FFHQ_cloak
  cloak_mix: true
  cloak_count: full
  cloak_index: 0
  cloak_min_distance: 1.04
  cloak_distance: 1.20

defense:
  batch_size: 10
  epochs: 200
  epsilon: 0.005
  limit:
    R: 0.10
    G: 0.10
    B: 0.10
    identity: 0.003
  weight:
    perturb: 30
    identity: 10000
    cloak: 10000
  silent_perturb: false
  only_save_summary: true
  log_interval: 20
